apis:
- aid: open-insurance:open-certificate-of-currency-api
  name: Open Certificate of Currency API
  description: The single documented server-side REST operation on the Open Platform.
    POST /v1/policy/coc retrieves a Certificate of Currency for an existing policy
    directly from the insurer to validate cover, returning JSON or PDF. Credentials
    are an api_key / api_secret pair passed in the request body, issued by Open at
    partner account creation. The published OpenAPI 3.0.3 definition declares the sandbox
    host https://api.sandbox.beopen.com; the production host https://api.beopen.com
    answers the same path (GET returns 405, POST only).
  humanURL: https://developers.beopen.com/reference/coc
  baseURL: https://api.beopen.com
  tags:
  - Insurance
  - Policy
  - Certificate of Currency
  - Australia
