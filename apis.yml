name: Open
kind: company
description: Open Insurance Pty Limited (ABN 23 166 949 444, AFSL 451712), trading
  as Open, is an Australian insurtech and underwriting agency that packages car, home
  and contents, landlord and travel cover as an embedded product other brands can
  sell. Open is not a carrier — it holds a binding authority from the insurer, acts
  as the insurer's agent to issue, vary, renew and cancel policies and to handle claims,
  and appoints partner brands as authorised representatives. Huddle Insurance is a
  business name of Open, and partner programs include Bupa and the SuperSaveClub marketplace;
  the business also operates in the United Kingdom and New Zealand from its Australian
  home market. Its API posture is real but narrow and partner-gated. Open runs a public,
  unauthenticated ReadMe developer hub at developers.beopen.com covering the Open.js
  browser SDK, the Open.Widget embed and a URL-handover redirect, plus exactly one
  documented server-side REST operation — POST /v1/policy/coc, Retrieve a Certificate
  of Currency — for which a real OpenAPI 3.0.3 definition is published. Quote is only
  prepared and polled through the SDK; bind, issue, policy servicing and claims all
  happen inside Open's hosted (optionally white-labelled) journey rather than over
  an API, and there is no public FNOL, webhook, GraphQL or Postman surface. API keys
  and secrets are issued by Open at partner account creation — there is no self-serve
  signup — and no ACORD, AL3 or NGDS reference appears anywhere on the site or in the
  documentation.
