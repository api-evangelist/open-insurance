- aid: open-insurance:open-js-embedded-insurance-sdk
  name: Open.js Embedded Insurance SDK
  description: Open's browser JavaScript library for embedding insurance into a partner's
    web app. Documented methods are opensdk.quote.load, opensdk.quote.prepare, opensdk.quote.portal,
    opensdk.quote.status, opensdk.quote.history, opensdk.magiclink and opensdk.manage.portal.
    It creates and pre-fills a quote and polls its status, then hands the customer
    to Open's hosted portal to complete purchase, manage the policy and claim — bind
    and issue are not exposed as API calls. The library defaults to the api.beopen.com
    backend (api.sandbox.beopen.com in sandbox) and portal.beopen.com, and is served
    from https://opensdk.s3-ap-southeast-2.amazonaws.com/opensdk-1.3.0.min.js. Sibling
    integration surfaces documented in the same hub are Open.Widget and a URL handover
    redirect.
  humanURL: https://developers.beopen.com/docs/openjs
  baseURL: https://api.beopen.com
