note: >-
  Open's conformance posture is almost entirely REGULATORY rather than technical.
  It is an authorised, licensed insurance distributor in three markets and says so
  in its terms pages, but it adopts no insurance data standard (no ACORD, AL3,
  NGDS, IVANS) and no API standard beyond plain HTTP/JSON. There are no published
  security certifications (no SOC 2, ISO 27001, PCI DSS attestation, HIPAA or
  FedRAMP) on any Open host, and no trust centre.
