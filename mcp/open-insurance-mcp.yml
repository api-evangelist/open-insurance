  401 {"code":-32001,"message":"Authorization required"}. RFC 9728 metadata at /.well-known/oauth-protected-resource/mcp
  names ReadMe's authorization server (https://dash.readme.com/oidc), which identifies this as the documentation-search
  MCP server that the ReadMe developer-hub platform provisions — not an Open product API. Its tool list
  and inputSchemas could not be enumerated anonymously. (2) Open's marketing publishes a product claim
  of "native" Model Context Protocol support so that ChatGPT and Claude can pull live product and pricing
  data and hand a customer into a pre-filled quote. As of this probe Open publishes NO server URL, NO
  tool list, NO inputSchemas and NO auth instructions for that product MCP surface; it is sold through
  "Contact sales". Nothing about its tools is recorded here because nothing is published.
