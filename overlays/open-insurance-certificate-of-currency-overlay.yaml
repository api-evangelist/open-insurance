x-source: openapi/open-insurance-certificate-of-currency-openapi.json
x-note: >-
  Our enhancements to Open's published OpenAPI. The harvested definition is left
  untouched. Every action below either records what the docs state but the spec
  omits (the credential model, the production host, the documented error
  statuses) or annotates a real defect in the contract (info.version "unknown",
